<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>ЛР 03 – сеанс</title>
</head>
<body>
  <h1>Навчальний сеанс</h1>
  <p id="state">Стан не перевірено.</p>

  <h2>Реєстрація</h2>
  <form id="register">
    <label>Ім’я користувача <input name="userName" required></label>
    <label>Email <input name="email" type="email" required></label>
    <label>Відображуване ім’я <input name="displayName" required></label>
    <label>Пароль <input name="password" type="password" autocomplete="new-password" required></label>
    <button>Зареєструватись</button>
  </form>

  <h2>Вхід</h2>
  <form id="login">
    <label>Ім’я <input name="userName" autocomplete="username" required></label>
    <label>Пароль <input name="password" type="password" autocomplete="current-password" required></label>
    <button>Увійти</button>
  </form>

  <h2>Профіль</h2>
  <button id="me" type="button">Мій профіль</button>
  <p>id: <span id="profile-id"></span></p>
  <p>userName: <span id="profile-name"></span></p>

  <h2>Новий інцидент</h2>
  <form id="incident">
    <label>Заголовок <input name="title" required></label>
    <label>Опис <textarea name="description" required></textarea></label>
    <label>Важливість
      <select name="severity">
        <option>Low</option><option>Medium</option><option>High</option><option>Critical</option>
      </select>
    </label>
    <label>Час події <input name="occurredAt" type="datetime-local" required></label>
    <button>Створити</button>
  </form>

  <button id="logout" type="button">Вийти</button>
  <p id="result" role="status"></p>
  <script type="module" src="auth-lab.js"></script>
</body>
</html>

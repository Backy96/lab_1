name: secure-lab

services:
  postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: securelab
      POSTGRES_USER: securelab
      POSTGRES_PASSWORD: local-study-password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securelab -d securelab"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # Advanced variant ЛР 6: спільний лічильник rate limiting пошуку.
  # Запускається лише явно: docker compose -f infra/compose.yaml --profile redis up -d redis
  # Зберігає тільки лічильники з TTL, без persistence; порт доступний лише з localhost.
  redis:
    image: redis:7.4-alpine
    profiles: ["redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: "no"

volumes:
  postgres-data:
